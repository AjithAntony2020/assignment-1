<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Responsive Navigation Bar (Flexbox) -->
    <nav class="navbar">
        <div class="logo">Portfolio</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Feature/Project Card (CSS Grid) -->
    <section class="projects-section">
        <h2>Featured Project</h2>
        <div class="projects-container">
            <article class="project-card">
                <img src="logoImage.png" alt="Web Design Project">
                <div class="card-badge">Web Design</div>
                <h3 class="card-title">Responsive design</h3>
                <p class="card-description">A responsive page built with HTML5 and CSS3.</p>
                <button class="view-btn">View Project</button>
            </article>
        </div>
    </section>

</body>
</html>
